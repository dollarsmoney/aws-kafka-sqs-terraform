# ElasticMQ: a small SQS-compatible server for local dev. Mirrors infra/modules/sqs.
include classpath("application.conf")

queues {
  order-jobs-dlq {}

  order-jobs {
    defaultVisibilityTimeout = 10 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "order-jobs-dlq"
      maxReceiveCount = 3
    }
  }
}
