# Run the whole pipeline on your laptop for free before paying for MSK:
#   docker compose -f docker-compose.local.yml up --build
# Kafka = single-node apache/kafka (KRaft, no ZooKeeper), SQS = ElasticMQ.

x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    kafka: { condition: service_healthy }
    elasticmq: { condition: service_started }
  environment:
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: local       # ElasticMQ ignores these, but the SDK needs *some* credentials
    AWS_SECRET_ACCESS_KEY: local
    KAFKA_BROKERS: kafka:9092
    KAFKA_SSL: "false"
    KAFKA_REPLICATION_FACTOR: "1"  # one local broker (MSK uses 2)
    ORDERS_TOPIC: orders.created
    PAYMENTS_TOPIC: payments.completed
    KAFKA_CREATE_TOPICS: "true"    # no Terraform for local Kafka, so the app creates topics
    SQS_ENDPOINT: http://elasticmq:9324
    SQS_QUEUE_URL: http://elasticmq:9324/000000000000/order-jobs

services:
  kafka:
    image: apache/kafka:3.9.2 # same 3.9 line as MSK
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # same as our MSK config
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    ports: ["9324:9324", "9325:9325"] # 9325 = web UI showing queue depths
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro

  api:
    <<: *app
    command: ["node", "src/api.js"]
    ports: ["3000:3000"]
  forwarder:
    <<: *app
    command: ["node", "src/forwarder.js"]
  analytics:
    <<: *app
    command: ["node", "src/analytics.js"]
  worker:
    <<: *app
    command: ["node", "src/worker.js"]
