# App against Aiven Kafka, local SQS. Requires ./.env and ./certs (both git-ignored).

x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    elasticmq: { condition: service_started }
  env_file: .env
  volumes:
    - ./certs:/certs:ro

services:
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    ports: ["9324:9324", "9325:9325"]
    volumes:
      - ./local/elasticmq.conf:/opt/elasticmq.conf:ro

  api:
    <<: *app
    command: ["node", "src/api.js"]
    ports: ["3000:3000"]
  forwarder:
    <<: *app
    command: ["node", "src/forwarder.js"]
  analytics:
    <<: *app
    command: ["node", "src/analytics.js"]
  worker:
    <<: *app
    command: ["node", "src/worker.js"]
